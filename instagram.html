<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Auto Postar — conectando o Instagram</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0e1014; color: #e8eaee; margin: 0; padding: 40px 16px; }
  main { max-width: 560px; margin: 0 auto; }
  p { color: #9aa3b2; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1 id="titulo">Voltando para o Auto Postar…</h1>
  <p id="texto">Se nada acontecer em alguns segundos, confira se o aplicativo Auto Postar está aberto no seu computador.</p>
</main>
<script>
  // A Meta só devolve o login para endereços https. Esta página não guarda nada:
  // só repassa o código para o Auto Postar que está rodando no seu próprio PC.
  // A porta do app vem dentro do "state" (ex.: 8765-abc123).
  (function () {
    var q = new URLSearchParams(location.search);
    var m = /^(\d{2,5})-[\w-]{8,}$/.exec(q.get("state") || "");
    if (!m) {
      document.getElementById("titulo").textContent = "Link de login inválido";
      document.getElementById("texto").textContent = "Abra o Auto Postar e clique em Conectar Instagram de novo.";
      return;
    }
    var volta = new URLSearchParams();
    ["code", "state", "error", "error_reason", "error_description"].forEach(function (k) {
      if (q.has(k)) volta.set(k, q.get(k));
    });
    location.replace("http://127.0.0.1:" + m[1] + "/auth/instagram/retorno?" + volta.toString());
  })();
</script>
</body>
</html>
